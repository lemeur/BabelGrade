# Ruff config — ELT Assessor
# app/ = strict (default rule set: E4, E7, E9, F).
# tests/ + scripts/ = relaxed: test files use compact one-liners and
# convenience multi-imports that would be noise to reformat here.
[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
"tests/*" = ["E401", "E402", "E701", "E702"]
"scripts/*" = ["E401", "E402", "E701", "E702"]
